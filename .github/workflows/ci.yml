# CI for looot-plugin. Not enabled: GitHub Actions stay off until the owner turns them on.
# Once on, switch the trigger to push and pull_request.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: bash scripts/leak-scan.sh .
      - run: python3 tests/validate_plugin.py
